[package]
name = "claude-bar"
version = "0.1.3"
description = "Local Codex and Claude token ledger"
authors = ["binnnnnn520"]
edition = "2021"

[lib]
name = "claude_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-bar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
